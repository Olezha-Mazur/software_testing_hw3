name: Docker API test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  docker-api-test:
    name: Build image and run API test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --tag api-test:${{ github.sha }} .

      - name: Run API test in container
        run: docker run --rm api-test:${{ github.sha }}
